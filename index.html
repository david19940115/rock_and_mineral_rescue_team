<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102833"><title>岩礦探險｜選擇地點</title><link rel="stylesheet" href="game.css"><link rel="stylesheet" href="museum.css"><link rel="stylesheet" href="victory.css"><script src="catalog.js" defer></script><script src="turntable.js" defer></script><script src="museum.js" defer></script><script src="conveyor.js" defer></script><script src="game.js" defer></script><script src="music.js" defer></script></head>
<body>
<dialog id="startup-notice" aria-labelledby="startup-title" closedby="none">
  <div>
    <h1 id="startup-title">建議將平板、手機橫擺</h1>
    <p id="startup-countdown" aria-hidden="true">5</p>
  </div>
</dialog>
<script>
  const startupNotice = document.getElementById("startup-notice");
  startupNotice.addEventListener("cancel", event => event.preventDefault());
  startupNotice.showModal();
  const countdown = document.getElementById("startup-countdown");
  const duration = Number(countdown.textContent);
  for (let elapsedSeconds = 1; elapsedSeconds < duration; elapsedSeconds++) {
    window.setTimeout(() => {
      countdown.textContent = String(duration - elapsedSeconds);
    }, elapsedSeconds * 1000);
  }
  window.setTimeout(() => {
    startupNotice.close();
    const heading = document.querySelector("main h1");
    if (heading) {
      heading.tabIndex = -1;
      heading.focus({preventScroll: true});
    }
  }, duration * 1000);
</script>
<header><div class="brand"><span class="crest">◆</span><span id="game-name">選擇探險地點</span></div><nav id="game-nav" aria-label="遊戲工具"><button id="sound" type="button" aria-label="音樂與音效" aria-pressed="true">♫ 開</button><button id="book">▤　圖鑑</button><button id="help" aria-label="玩法說明">？</button></nav></header><audio id="music-track" src="assets/valley-stroll.mp3" loop preload="metadata" playsinline></audio><main id="main"></main><footer><span id="game-place">玉里・蘇澳</span><span>自然科學　／　六年級</span></footer><dialog id="dialog"><div id="dialogbody"></div><button id="close" class="action">返回遊戲</button></dialog><dialog id="victory" aria-labelledby="victory-title" aria-describedby="victory-next"></dialog><div id="notice" role="status"></div></body></html>
