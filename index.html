<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102833">
  <title>岩礦探險｜選擇地點</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      background: #0c2029;
    }
    #game-frame {
      position: fixed;
      top: 0;
      left: 0;
      display: block;
      width: 100vw;
      height: 100vh;
      width: 100dvw;
      height: 100dvh;
      border: 0;
    }
    @media (orientation: portrait) and (any-pointer: coarse) {
      /* Use a landscape viewport inside the frame so controls and dialogs rotate together. */
      #game-frame {
        left: 100vw;
        left: 100dvw;
        width: 100vh;
        height: 100vw;
        width: 100dvh;
        height: 100dvw;
        transform-origin: top left;
        transform: rotate(90deg);
      }
    }
  </style>
</head>
<body>
  <iframe id="game-frame" title="岩礦探險" allow="autoplay"></iframe>
  <script>
    const gameFrame = document.getElementById("game-frame");
    gameFrame.src = "game.html" + window.location.search + window.location.hash;
  </script>
</body>
</html>
